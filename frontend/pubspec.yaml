name: deaf_alphabets
description: "Vaila Phonics Teaching Mobile Application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_tts: ^4.0.2
  just_audio: ^0.9.38
  record: 5.1.2
  vibration: ^2.0.0
  http: ^1.2.1
  path_provider: ^2.1.3
  google_fonts: ^6.2.1
  shared_preferences: ^2.2.3
  image_picker: ^1.1.2
  speech_to_text: ^7.4.0
  camera: ^0.12.0+2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

dependency_overrides:
  record_platform_interface: 1.2.0

flutter:
  uses-material-design: true
